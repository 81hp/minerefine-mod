org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Where GitHub Actions' setup-java puts its JDKs (ignored when unset, as on a normal PC).
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Shared by every Minecraft version. The per-version values (Minecraft range, Fabric API, Java)
# are in versions/<minecraft version>/gradle.properties.
mod_version=1.2.0
maven_group=minerefinehud
archives_base_name=minerefine-mod

loader_version=0.19.5
loomx.loom_version=1.18.2
