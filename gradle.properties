org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# FILL THESE IN BEFORE THE FIRST BUILD.
#
# Go to https://fabricmc.net/develop, pick 1.21.11, and copy the four values it
# prints. They change with every Minecraft release and guessing them is the most
# common reason a generated Fabric project refuses to build.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_version=0.141.6+1.21.11

# Loom is the Fabric Gradle plugin. fabricmc.net/develop lists the current one.
loom_version=1.13.6

mod_version=1.0.10
maven_group=minerefinehud
archives_base_name=minerefine-mod
